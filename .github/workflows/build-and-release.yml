name: Build and Release

on:
  push:
    branches: [ main ]

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Get version from code
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import re; content = open('cyberdriver.py', encoding='utf-8').read(); print(re.search(r'VERSION = \"(.+?)\"', content).group(1))")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  create-release:
    runs-on: ubuntu-latest
    needs: get-version
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v3
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.get-version.outputs.version }}
          release_name: v${{ needs.get-version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            Cyberdriver v${{ needs.get-version.outputs.version }}
            
            ### Changes
            ${{ github.event.head_commit.message }}

  build:
    needs: [get-version, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            requirements: requirements-windows.txt
          - os: macos-latest
            requirements: requirements.txt
          - os: ubuntu-latest
            requirements: requirements-linux.txt
          - os: ubuntu-24.04-arm
            requirements: requirements-linux.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      # Linux PyAutoGUI imports python-xlib at module-load time, which links
      # against libX11. Install the X libs (and python3-tk for PyMsgBox) so the
      # PyInstaller analysis pass can `import pyautogui` cleanly.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk python3-dev \
            libx11-6 libxext6 libxrender1 libxtst6 libxinerama1 libxi6 libxrandr2 \
            scrot xdotool
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}
          pip install pyinstaller
      - name: Build executable
        run: |
          pyinstaller cyberdriver.spec
      - name: Prepare artifact info
        id: artifact
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "asset_path=dist/cyberdriver.exe" >> $GITHUB_OUTPUT
            echo "asset_name=cyberdriver.exe" >> $GITHUB_OUTPUT
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            # Map `uname -m` to the conventional GOARCH-style label users expect:
            #   x86_64  -> amd64
            #   aarch64 -> arm64
            UNAME_M=$(uname -m)
            case "$UNAME_M" in
              x86_64)  ARCH=amd64 ;;
              aarch64) ARCH=arm64 ;;
              *)       ARCH="$UNAME_M" ;;
            esac
            ASSET="cyberdriver-linux-${ARCH}"
            mv dist/cyberdriver "dist/${ASSET}"
            chmod +x "dist/${ASSET}"
            echo "asset_path=dist/${ASSET}" >> $GITHUB_OUTPUT
            echo "asset_name=${ASSET}" >> $GITHUB_OUTPUT
          else
            ARCH=$(uname -m)
            (cd dist && zip -9 "cyberdriver-macos-${ARCH}.zip" cyberdriver)
            echo "asset_path=dist/cyberdriver-macos-${ARCH}.zip" >> $GITHUB_OUTPUT
            echo "asset_name=cyberdriver-macos-${ARCH}.zip" >> $GITHUB_OUTPUT
          fi
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ${{ steps.artifact.outputs.asset_path }}
          asset_name: ${{ steps.artifact.outputs.asset_name }}
          asset_content_type: application/octet-stream