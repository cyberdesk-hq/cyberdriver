name: Build Test Version

on:
  push:
    branches: [ dev ]

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Delete existing test release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete test --yes || true
          git push origin :refs/tags/test || true
          
      - name: Create new test release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Use a temporary file to safely build release notes without shell interpolation issues
          {
            echo "⚠️ **Test Build from dev branch**"
            echo ""
            echo "This is an automatically generated test build from the latest dev branch commit."
            echo ""
            printf "**Commit:** %s\n" "${{ github.sha }}"
            printf "**Date:** %s\n" "$(date -u +"%Y-%m-%d %H:%M:%S UTC")"
            echo "**Commit Message:**"
            printf -- "%s\n" "$COMMIT_MESSAGE"
            echo ""
            echo "This test release is always overwritten with the latest dev build."
            echo ""
            echo "Builds are currently being generated..."
          } > notes.md

          gh release create test \
            --title "Test Build (Latest Dev)" \
            --notes-file notes.md \
            --prerelease \
            --target ${{ github.sha }}

  build-test:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            requirements: requirements-windows.txt
          - os: macos-latest
            requirements: requirements.txt
          - os: ubuntu-latest
            requirements: requirements-linux.txt
          - os: ubuntu-24.04-arm
            requirements: requirements-linux.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Linux PyAutoGUI imports python-xlib at module-load time, which links
      # against libX11. Install the X libs (and python3-tk for PyMsgBox) so the
      # PyInstaller analysis pass can `import pyautogui` cleanly.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk python3-dev \
            libx11-6 libxext6 libxrender1 libxtst6 libxinerama1 libxi6 libxrandr2 \
            scrot xdotool

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.requirements }}
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller cyberdriver.spec

      - name: Prepare artifact
        id: artifact
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            echo "asset_path=dist/cyberdriver.exe" >> $GITHUB_OUTPUT
            echo "asset_name=cyberdriver.exe" >> $GITHUB_OUTPUT
          elif [[ "${{ runner.os }}" == "Linux" ]]; then
            UNAME_M=$(uname -m)
            case "$UNAME_M" in
              x86_64)  ARCH=amd64 ;;
              aarch64) ARCH=arm64 ;;
              *)       ARCH="$UNAME_M" ;;
            esac
            ASSET="cyberdriver-test-linux-${ARCH}"
            mv dist/cyberdriver "dist/${ASSET}"
            chmod +x "dist/${ASSET}"
            echo "asset_path=dist/${ASSET}" >> $GITHUB_OUTPUT
            echo "asset_name=${ASSET}" >> $GITHUB_OUTPUT
          else
            ARCH=$(uname -m)
            (cd dist && zip -9 "cyberdriver-test-macos-${ARCH}.zip" cyberdriver)
            echo "asset_path=dist/cyberdriver-test-macos-${ARCH}.zip" >> $GITHUB_OUTPUT
            echo "asset_name=cyberdriver-test-macos-${ARCH}.zip" >> $GITHUB_OUTPUT
          fi

      - name: Upload to Test Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload test ${{ steps.artifact.outputs.asset_path }} --clobber

